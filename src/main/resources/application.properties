spring.application.name=SpringBatchDemo

spring.datasource.url=jdbc:mysql://localhost:3306/springbatchdemo?createDatabaseIfNotExist=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=Root

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#disabled job run at startup
spring.batch.job.enabled=false

# MySQL is not an embedded DB, so Spring Batch won't auto-create its
# metadata tables (BATCH_JOB_INSTANCE, etc.) unless told to.
spring.batch.jdbc.initialize-schema=always
